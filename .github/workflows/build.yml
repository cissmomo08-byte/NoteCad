name: Build NoteCad downloads

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS Universal
            os: macos-latest
            command: npm run dist:mac
            artifact: macos
          - platform: Windows 64-bit
            os: windows-latest
            command: npm run dist:win
            artifact: windows
          - platform: Linux 64-bit
            os: ubuntu-latest
            command: npm run dist:linux
            artifact: linux

    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build tools
        run: npm install
      - name: Create installer
        run: ${{ matrix.command }}
      - name: Save installer files
        uses: actions/upload-artifact@v4
        with:
          name: notecad-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: Prepare the public download page
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Add the offline web version
        run: cp index.html installers/NoteCad.html
      - name: Create or refresh the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" = "true" ]; then
              gh release upload "$tag" installers/* --clobber
            else
              echo "Release $tag is already public; leaving it unchanged."
            fi
          else
            gh release create "$tag" installers/* --draft --title "NoteCad $version" --notes-file .github/RELEASE_NOTES.md --target "$GITHUB_SHA"
          fi
