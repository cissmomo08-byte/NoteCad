name: Build NoteCad downloads

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS Universal
            os: macos-latest
            command: npm run dist:mac
            artifact: macos
          - platform: Windows 64-bit
            os: windows-latest
            command: npm run dist:win
            artifact: windows
          - platform: Linux 64-bit
            os: ubuntu-latest
            command: npm run dist:linux
            artifact: linux

    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build tools
        run: npm install
      - name: Create installer
        run: ${{ matrix.command }}
      - name: Save installer files
        uses: actions/upload-artifact@v4
        with:
          name: notecad-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 7
